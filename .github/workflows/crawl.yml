name: Crawl 9tsu Links (Batch 500)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_download:
        description: 'Download ulang semua sitemap'
        required: false
        default: 'false'
        type: boolean
      reset:
        description: 'Reset status pemrosesan (proses ulang semua sitemap)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Create sitemaps directory if missing
        run: |
          mkdir -p sitemaps
          touch sitemaps/.gitkeep
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests cloudscraper beautifulsoup4 lxml
          
      - name: Run crawler
        id: crawler
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force_download }}" == "true" ]; then
            ARGS="$ARGS --download"
          fi
          if [ "${{ github.event.inputs.reset }}" == "true" ]; then
            ARGS="$ARGS --reset"
          fi
          python crawl_9tsu.py $ARGS
          
      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update database and json [skip ci]'
          file_pattern: '*.db *.json sitemaps/*'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
          push_options: '--force'
          
      - name: No changes
        if: steps.check_changes.outputs.changes == 'false'
        run: echo "✅ Tidak ada perubahan, skip commit"
