name: Clean Null Embed URL

on:
  # 🔄 Jadwal: setiap hari jam 03:00 UTC (setelah crawl & update domain)
  schedule:
    - cron: '0 3 * * *'
  
  # 🔘 Manual: bisa dijalankan dari tab Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # ============================================================
      # STEP 1: Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # ============================================================
      # STEP 2: Setup Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # ============================================================
      # STEP 3: Create clean script
      # ============================================================
      - name: Create clean script
        run: |
          cat > clean_null_embed.py << 'EOF'
          import sqlite3
          import json
          import os
          import shutil
          from datetime import datetime
          
          DB_FILE = "links.db"
          JSON_FILE = "links.json"
          
          def backup_file(filename):
              timestamp = datetime.now().strftime("%Y%m%d_%H%M%S")
              backup_name = f"{filename}.backup_clean_{timestamp}"
              if os.path.exists(filename):
                  shutil.copy2(filename, backup_name)
                  print(f"📦 Backup dibuat: {backup_name}")
                  return backup_name
              print(f"⚠️ File {filename} tidak ditemukan, backup skip")
              return None
          
          def clean_database():
              if not os.path.exists(DB_FILE):
                  print(f"⚠️ File {DB_FILE} tidak ditemukan, lewati database")
                  return 0
              
              backup_file(DB_FILE)
              
              conn = sqlite3.connect(DB_FILE)
              cursor = conn.cursor()
              
              cursor.execute("SELECT COUNT(*) FROM links WHERE embed_url IS NULL OR embed_url = ''")
              total = cursor.fetchone()[0]
              print(f"🔍 Ditemukan {total} record dengan embed_url NULL/empty")
              
              if total == 0:
                  print("✅ Tidak ada data yang perlu dibersihkan")
                  conn.close()
                  return 0
              
              cursor.execute("DELETE FROM links WHERE embed_url IS NULL OR embed_url = ''")
              deleted = cursor.rowcount
              conn.commit()
              conn.close()
              
              print(f"🗑️  {deleted} record dihapus dari database")
              return deleted
          
          def clean_json():
              if not os.path.exists(JSON_FILE):
                  print(f"⚠️ File {JSON_FILE} tidak ditemukan, lewati JSON")
                  return 0
              
              backup_file(JSON_FILE)
              
              with open(JSON_FILE, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              
              original_count = len(data.get('links', []))
              cleaned_links = [
                  link for link in data.get('links', [])
                  if link.get('embed_url') not in [None, '', 'null']
              ]
              removed = original_count - len(cleaned_links)
              
              if removed == 0:
                  print("✅ Tidak ada perubahan di JSON")
                  return 0
              
              data['links'] = cleaned_links
              data['total'] = len(cleaned_links)
              data['timestamp'] = datetime.now().isoformat()
              
              with open(JSON_FILE, 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              
              print(f"🗑️  {removed} link dihapus dari JSON")
              return removed
          
          def main():
              print("=" * 60)
              print("🧹 CLEAN NULL EMBED_URL")
              print("=" * 60)
              db_deleted = clean_database()
              json_removed = clean_json()
              print("\n" + "=" * 60)
              print(f"✅ Selesai!")
              print(f"   - Database: {db_deleted} record dihapus")
              print(f"   - JSON: {json_removed} link dihapus")
              print("=" * 60)
          
          if __name__ == "__main__":
              main()
          EOF
      
      # ============================================================
      # STEP 4: Run clean script
      # ============================================================
      - name: Run clean script
        run: |
          python clean_null_embed.py
      
      # ============================================================
      # STEP 5: Check for changes
      # ============================================================
      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "📝 Changes detected:"
            git status --porcelain
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "✅ No changes detected"
          fi
      
      # ============================================================
      # STEP 6: Commit and push changes
      # ============================================================
      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            chore: clean null embed_url [skip ci]
            
            - Remove records with embed_url = NULL/empty
            - Total remaining: $(jq '.total' links.json 2>/dev/null || echo "unknown")
          file_pattern: '*.db *.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
          push_options: '--force'
          skip_fetch: true
      
      # ============================================================
      # STEP 7: No changes
      # ============================================================
      - name: No changes
        if: steps.check_changes.outputs.changes == 'false'
        run: echo "✅ Tidak ada perubahan, skip commit"
