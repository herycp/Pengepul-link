name: 🗂️ Crawl Categories & Episodes

on:
  schedule:
    - cron: '0 0 * * *' # Berjalan otomatis setiap hari (Opsional)
  workflow_dispatch: # Tombol jalankan manual

permissions:
  contents: write

jobs:
  scrape-categories:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests cloudscraper beautifulsoup4 lxml
          
      - name: Run Category Scraper
        env:
          PYTHONUNBUFFERED: 1
        run: |
          echo "🚀 Menjalankan scraping kategori via AJAX API..."
          python crawl_categories.py
          
      - name: Check for changes
        id: check
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push changes
        if: steps.check.outputs.changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            chore: update categories and episodes data [skip ci]
          file_pattern: 'categories_data.json categories.db'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          
      - name: No changes
        if: steps.check.outputs.changes == 'false'
        run: echo "✅ Data kategori masih up-to-date, tidak ada perubahan yang disimpan."
