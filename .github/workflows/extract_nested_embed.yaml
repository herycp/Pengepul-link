name: Extract Nested Embeds Batch Processing

on:
  schedule:
    # Dijalankan otomatis setiap 6 jam sekali (bisa disesuaikan)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Memungkinkan untuk menjalankan skrip secara manual dari tab Actions

permissions:
  contents: write # PENTING: Izin menulis agar GitHub Actions bisa commit & push file DB/Backups

jobs:
  run-extraction:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Menarik seluruh commit history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cloudscraper beautifulsoup4

      - name: Run Embed Extraction
        run: |
          python extract_nested_embed.py --all

      - name: Commit and Push Changes (Database, JSON, & Backups)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage file utama dan folder backups
          git add links.db links.json extract_progress.json backups/
          
          # Cek apakah ada perubahan file sebelum commit
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "auto: extract embed batch update & backup [skip ci]"
            git push
            echo "✅ Perubahan berhasil di-push ke repository!"
          else
            echo "ℹ️ Tidak ada perubahan data pada batch ini."
          fi
