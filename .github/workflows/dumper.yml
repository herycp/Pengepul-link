name: 📥 Dump Raw Titles (Untuk Analisis Pattern)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-dump] # Webhook trigger agar bisa diotomatisasi dengan cron-job.org

permissions:
  contents: write

jobs:
  dump_titles:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Diturunkan ke 60 menit karena 2500 link via multi-thread akan selesai cepat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests cloudscraper beautifulsoup4 lxml

      - name: Run Dumper Script
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python dump_raw_titles.py
          
      - name: Check for changes and Set Output
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            TOTAL=$(jq 'length' raw_titles.json 2>/dev/null || echo "unknown")
            echo "TOTAL_TITLES=$TOTAL" >> $GITHUB_ENV
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "✅ Tidak ada penambahan raw title baru"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            chore: update raw_titles.json batch 2500 [skip ci]
            
            - Total raw titles collected: ${{ env.TOTAL_TITLES }}
          file_pattern: 'raw_titles.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
