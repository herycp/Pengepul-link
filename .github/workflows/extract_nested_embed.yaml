name: Extract, Sync & Generate Markdown Reports Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cloudscraper beautifulsoup4

      - name: 1. Run Embed Extraction
        run: |
          python extract_nested_embed.py --all

      - name: 2. Force Sync DB to JSON
        run: |
          python check_integrity.py --sync-db-to-json

      - name: 3. Generate 3 Markdown Reports
        run: |
          python check_integrity.py --generate-reports

      - name: 4. Commit and Push Everything (DB, JSON, Backups & MD Reports)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Force-add semua file termasuk DB, backups, dan laporan MD
          git add -f links.db links.json extract_progress.json backups/ reports/*.md
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "docs(reports): update embed extraction, sync & 3 md reports [skip ci]"
            git pull origin ${{ github.ref_name }} --rebase || true
            git push origin HEAD:${{ github.ref_name }}
            echo "🚀 Berhasil mem-push database dan 3 file laporan .MD ke repositori!"
          else
            echo "ℹ️ Tidak ada perubahan data pada batch ini."
          fi
